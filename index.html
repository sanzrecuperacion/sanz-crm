<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a1628">
  <title>SANZ CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0a1628; }
    #root { height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050b16; }
    ::-webkit-scrollbar-thumb { background: #c9a84044; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#050b16;flex-direction:column;gap:14px;font-family:Manrope,sans-serif;">
      <div style="width:60px;height:60px;border:3px solid #c9a84033;border-top-color:#c9a840;border-radius:50%;animation:spin 1s linear infinite;"></div>
      <div id="step" style="color:#c9a840;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;">Iniciando...</div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>

<script>
(function() {
  var step = document.getElementById('step');
  function setStep(t) { if (step) step.textContent = t; }
  function setError(msg) {
    document.getElementById('root').innerHTML = 
      '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#050b16;flex-direction:column;gap:14px;font-family:Manrope,sans-serif;padding:24px;text-align:center;">' +
      '<div style="color:#d14848;font-size:14px;font-weight:700;">No se pudo cargar</div>' +
      '<div style="color:#6a7f98;font-size:12px;max-width:380px;line-height:1.5;">' + msg + '</div>' +
      '<button onclick="location.reload()" style="margin-top:12px;padding:11px 22px;background:#c9a840;border:none;border-radius:8px;color:#0a1628;font-weight:700;cursor:pointer;font-family:inherit;">Recargar</button>' +
      '</div>';
  }
  
  function loadScript(url) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.async = false;
      s.onload = function() { resolve(url); };
      s.onerror = function() { reject(new Error('No se pudo cargar ' + url)); };
      document.head.appendChild(s);
    });
  }
  
  function loadFromAny(name, urls) {
    return new Promise(function(resolve, reject) {
      function tryNext(idx) {
        if (idx >= urls.length) {
          reject(new Error(name + ': todas las fuentes fallaron'));
          return;
        }
        loadScript(urls[idx])
          .then(resolve)
          .catch(function(e) {
            console.warn('Fallo ' + urls[idx] + ', probando siguiente');
            tryNext(idx + 1);
          });
      }
      tryNext(0);
    });
  }
  
  var sequence = [
    {
      name: 'React',
      urls: [
        'https://unpkg.com/react@18.2.0/umd/react.production.min.js',
        'https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js'
      ],
      check: function() { return typeof React !== 'undefined' && React.createElement; }
    },
    {
      name: 'ReactDOM',
      urls: [
        'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js',
        'https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js'
      ],
      check: function() { return typeof ReactDOM !== 'undefined' && ReactDOM.createRoot; }
    },
    {
      name: 'react-is',
      urls: [
        'https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js',
        'https://cdn.jsdelivr.net/npm/react-is@18.2.0/umd/react-is.production.min.js'
      ],
      check: function() { return true; }
    },
    {
      name: 'PropTypes',
      urls: [
        'https://unpkg.com/prop-types@15.8.1/prop-types.min.js',
        'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js'
      ],
      check: function() { return true; }
    },
    {
      name: 'Recharts',
      urls: [
        'https://unpkg.com/recharts@2.12.7/umd/Recharts.js',
        'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js'
      ],
      check: function() { return typeof Recharts !== 'undefined' && Recharts.BarChart; }
    },
    {
      name: 'Firebase App',
      urls: [
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'
      ],
      check: function() { return typeof firebase !== 'undefined' && firebase.initializeApp; }
    },
    {
      name: 'Firebase Auth',
      urls: [
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js'
      ],
      check: function() { return typeof firebase !== 'undefined' && firebase.auth; }
    },
    {
      name: 'Firebase Firestore',
      urls: [
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'
      ],
      check: function() { return typeof firebase !== 'undefined' && firebase.firestore; }
    }
  ];
  
  async function loadAll() {
    for (var i = 0; i < sequence.length; i++) {
      var item = sequence[i];
      setStep('(' + (i+1) + '/' + sequence.length + ') Cargando ' + item.name);
      try {
        await loadFromAny(item.name, item.urls);
        await new Promise(function(r){ setTimeout(r, 100); });
        if (!item.check()) {
          throw new Error(item.name + ' cargo pero el global no aparece');
        }
        console.log('[OK] ' + item.name);
      } catch(e) {
        console.error('[FAIL]', item.name, e.message);
        setError('Fallo cargando ' + item.name + '.<br><br>Posibles causas:<br>1. Sin conexion a internet<br>2. Antivirus o adblocker bloqueando<br>3. Firewall<br><br><span style="font-size:10px;opacity:.7;">' + e.message + '</span>');
        return;
      }
    }
    setStep('Iniciando aplicacion...');
    try {
      window.__startSanzApp();
    } catch(e) {
      console.error('Error al iniciar app:', e);
      setError('Error al iniciar:<br><span style="font-family:monospace;font-size:10px;">' + (e.message || 'Desconocido') + '</span>');
    }
  }
  
  loadAll();
})();
</script>

<script>
window.__startSanzApp = function() {
/* Globals desde CDN */const{useState,useEffect,useMemo,useRef}=React;const{BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,PieChart,Pie,Cell,LineChart,Line,CartesianGrid,Legend}=Recharts;/* ═══════════════════════════════════════════════════════════════════
   SANZ · Recuperación Muscular — CRM v7
   FIXES v7: sin IndexedDB · sin prompt/confirm · window.storage
             + localStorage fallback · finally garantizado
   ═══════════════════════════════════════════════════════════════════ *//* ── PALETA ─────────────────────────────────────────────────────── */const N='#0a1628',NL='#0f1e35',NM='#162942',ND='#050b16';const G='#c9a840',GX='#f5e7bd',GY='#6a7f98';const RD='#d14848',GN='#3fa978',BL='#4a8edb',PR='#9b7fd4';const FD='"Playfair Display",Georgia,serif';const FB='"Manrope",-apple-system,sans-serif';/* ── CONSTANTES ─────────────────────────────────────────────────── */const SVCS=['Masaje deportivo','Masaje relajante','Masaje terapéutico','Liberación miofascial','Punción seca','Electroterapia','Termoterapia','Crioterapia','Vendaje neuromuscular','Movilización articular','Estiramientos','Rehabilitación','Masaje descontracturante','Drenaje linfático','Otro'];const DURS=[30,45,60,75,90,120];const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const MES_S=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];const DDS=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];const HRS=Array.from({length:24},(_,i)=>`${String(i).padStart(2,'0')}:00`);/* Horario comercial: 9-14 y 16-21. Todo lo demás es urgencia. */const isUrgencia=hora=>{const h=parseInt((hora||'').slice(0,2));return h<8||h>=22;};/* Especialidades del equipo */const ESPECIALIDADES=['Recuperación muscular','Quiromasaje','Fisioterapia','Psicología','Entrenamiento personal','Nutrición','Osteopatía','Marketing','Otros'];/* Modalidades de sesión */const MODALIDADES=[{k:'presencial',l:'🏠 Presencial',c:'#3fa978'},{k:'online',l:'💻 Online',c:'#4a8edb'},{k:'domicilio',l:'🚗 A domicilio',c:'#9b7fd4'}];/* Paleta de colores para asignar a terapeutas */const COLORES_TERAPEUTA=['#c9a840','#3fa978','#4a8edb','#d14848','#9b7fd4','#e8c870','#6a7f98','#f57f5e','#2ab3b3','#d97ab8'];/* Terapeuta por defecto (el titular / dueño del negocio) */const TERAPEUTA_DEFAULT={id:'main',nombre:'Principal',especialidad:'Recuperación muscular',color:'#c9a840',telefono:'',email:'',comision:100,/* el titular se queda el 100% */activo:true,notas:'',rol:'admin'/* admin o terapeuta */};/* ═══ MODELOS DE COBRO PARA PERSONA DE MARKETING ═══
   El admin elige cómo paga al marketinero. Los 4 modelos cubren las opciones más comunes. */const MKT_MODELOS=[{k:'fijo',l:'Fijo mensual',desc:'Cobra una cantidad fija al mes'},{k:'por_cliente',l:'Por cliente nuevo captado',desc:'Cobra X € por cada cliente nuevo que entra'},{k:'porcentaje',l:'% sobre lo que facturan sus clientes la primera vez',desc:'Cobra un % sobre la primera facturación de cada cliente que captó'},{k:'mixto',l:'Mixto (base fija + bonus por cliente)',desc:'Base mensual + bonus por cliente captado'}];/* Mapeo: especialidad del terapeuta → key de sector del cliente */const ESPECIALIDAD_A_SECTOR={'Recuperación muscular':'recuperacion_muscular','Quiromasaje':'recuperacion_muscular','Fisioterapia':'fisioterapia','Psicología':'psicologia','Entrenamiento personal':'entrenamiento','Nutrición':'nutricion','Osteopatía':'recuperacion_muscular','Otros':null};/* Devuelve el sector (key) que corresponde a un terapeuta */const sectorDeTerapeuta=t=>{if(!t)return null;return ESPECIALIDAD_A_SECTOR[t.especialidad]||null;};/* Métodos de pago */const MET_PAGO=[{k:'efectivo',l:'💵 Efectivo',c:'#3fa978'},{k:'bizum',l:'📱 Bizum',c:'#4a8edb'},{k:'tarjeta',l:'💳 Tarjeta',c:'#9b7fd4'},{k:'transferencia',l:'🏦 Transferencia',c:'#c9a840'},{k:'paypal',l:'🅿️ PayPal',c:'#e8c870'},{k:'pendiente',l:'⏳ Pendiente',c:'#d14848'}];/* Ajustes de la empresa *//* Canales de adquisición de clientes — para analítica de marketing */const CANALES=[{k:'recomendacion',l:'👥 Recomendación',c:'#3fa978',desc:'Cliente trajo a otro'},{k:'instagram',l:'📸 Instagram',c:'#e1306c',desc:'Stories, posts, reels'},{k:'facebook',l:'📘 Facebook',c:'#1877f2',desc:'Posts, anuncios, grupos'},{k:'tiktok',l:'🎵 TikTok',c:'#ff0050',desc:'Vídeos virales'},{k:'google',l:'🔍 Google',c:'#4a8edb',desc:'Búsqueda + Google Maps'},{k:'google_ads',l:'💰 Google Ads',c:'#fbbc04',desc:'Anuncios pagados'},{k:'whatsapp',l:'💬 WhatsApp',c:'#25d366',desc:'Estado, grupos'},{k:'web',l:'🌐 Web propia',c:'#9b7fd4',desc:'Visita y contacta'},{k:'folleto',l:'📄 Folleto/Cartel',c:'#c9a840',desc:'Físico, impreso'},{k:'evento',l:'🎪 Evento/Feria',c:'#f57f5e',desc:'Stand, demostración'},{k:'gimnasio',l:'💪 Gimnasio',c:'#2ab3b3',desc:'Acuerdo con gym'},{k:'medico',l:'🩺 Médico/Fisio',c:'#e83e8c',desc:'Derivación profesional'},{k:'pasaba',l:'🚶 Pasaba por aquí',c:'#6a7f98',desc:'Ve el local'},{k:'otro',l:'❓ Otro',c:'#888',desc:'Sin clasificar'}];/* Etiquetas predefinidas para clientes (ampliable) *//* Especialidades de la ficha del cliente — cada una despliega sus preguntas */const ESPECIALIDADES_CLIENTE=[{k:'recuperacion_muscular',l:'💪 Recuperación muscular',c:'#c9a840',desc:'Masaje, descarga, recuperación post-esfuerzo'},{k:'fisioterapia',l:'🩺 Fisioterapia',c:'#9b7fd4',desc:'Tratamiento por fisioterapeuta colegiado'},{k:'nutricion',l:'🥗 Nutrición',c:'#3fa978',desc:'Plan nutricional por dietista-nutricionista'},{k:'entrenamiento',l:'🏋️ Entrenamiento personal',c:'#d14848',desc:'Plan de entrenamiento personalizado'},{k:'psicologia',l:'🧠 Psicología',c:'#7fc8e8',desc:'Atención por psicólogo colegiado'}];const ETIQUETAS_CLIENTE=[{k:'vip',l:'⭐ VIP',c:'#c9a840'},{k:'amigos',l:'💛 Amigos',c:'#ffb74d'},{k:'deportista',l:'🏃 Deportista',c:'#3fa978'},{k:'mayor',l:'👴 Mayor 65',c:'#9b7fd4'},{k:'embarazada',l:'🤰 Embarazada',c:'#e83e8c'},{k:'postcirugia',l:'🩹 Post-cirugía',c:'#d14848'},{k:'frecuente',l:'🔁 Frecuente',c:'#4a8edb'},{k:'nuevo',l:'🆕 Nuevo',c:'#2ab3b3'},{k:'corporativo',l:'🏢 Corporativo',c:'#6a7f98'},{k:'familia',l:'👨‍👩‍👧 Familia',c:'#f57f5e'},{k:'recomendador',l:'🤝 Recomienda',c:'#fbbc04'}];/* ═══ VERSIÓN Y CHANGELOG ═══
   Al lanzar una versión nueva, AÑADIR aquí arriba con los cambios.
   Si el usuario tiene una "ultimaVersionVista" anterior, le sale el cartelito. */const VERSION_CRM='2026.06.22';const CHANGELOG=[{v:'2026.06.22',fecha:'2026-06-22',cambios:['\uD83D\uDEAB Bloqueos VISIBLES en el calendario: las horas afectadas por un bloqueo se pintan ahora con un patrón naranja a rayas y la etiqueta \"\uD83D\uDEAB BLOQUEADO\" (vista día y semana). Antes solo se veía bajito o nada.','\u26A0\uFE0F Si pulsas sobre una hora bloqueada para crear cita, te pide confirmaci\xF3n: \"Esta hora est\xE1 BLOQUEADA. \xBFCrear cita igualmente?\". As\xED no se cuela una cita por descuido.','\u2702\uFE0F Medidor de dolor REMOVIDO del modal de cita (l\xF3gicamente pasa a las sesiones de tratamiento). El gr\xE1fico de evoluci\xF3n sigue mostrando datos antiguos.','\u23F0 \"Fuera de horario\" Fix: ampliado a 8h-22h (antes 9-14 y 16-21, dejaba fuera horas comunes).','\uD83D\uDCAC Bot\xF3n WhatsApp en el detalle de cita, junto a Llamar y SMS.','\uD83D\uDD27 Plantilla \"De camino\" t13 (que no estaba bien creada) ahora s\xED existe en la lista, simple sin pedirte temp/luz porque ya est\xE1n en la ficha del cliente.','\uD83D\uDD27 Bot\xF3n \"Abrir ficha completa\" solo si hay cliente v\xE1lido.',]},
{v:'2026.06.20',fecha:'2026-06-20',cambios:['\uD83D\uDD27 Bug embudo Marketing: contaba como \"sesi\xF3n\" SOLO las marcadas explicitamente \"completada\". Ahora cuenta tambi\xE9n las citas pasadas no canceladas (que ocurrieron de verdad aunque no marcaras el estado). Los nº de recurrentes ahora cuadran con la realidad.','\uD83D\uDC41\uFE0F Privacidad Marketing: cuando lo abre tu persona de marketing, los t\xEDtulos dejan claro que ven sus captados (no datos generales de la empresa). Embudo y ingresos por canal aparecen con \"(de tus captados)\".','\uD83D\uDCB0 Finanzas \u2014 3 KPIs nuevos en la cabecera: COMISIONES A PAGAR (total pendiente a terapeutas, calculado como generado \u2212 pagado), IRPF ESTIMADO (20% por defecto sobre el beneficio, modelo 130 trimestral), y BENEFICIO REAL (lo que te queda de verdad tras restar comisiones, IVA a liquidar e IRPF).','\u2696\uFE0F El IRPF % es configurable: si en Settings a\xF1ades \"irpfRate\" con tu tipo real (15% si inicias actividad, 7% pluriempleo, etc.) se aplica. Si no, 20% por defecto.','\uD83D\uDD27 Hotfix: pantalla azul al cargar el CRM. Causa: monthComis (comisiones del mes) se calculaba en App pero no llegaba como prop al Dashboard. Solucionado pasando la variable correctamente.','\uD83D\uDD17 Marketing tab MUCHO m\xE1s rico: nuevo bloque \"Embudo de captaci\xF3n\" con tasa de conversi\xF3n (captados \u2192 con 1\xAA cita) y retenci\xF3n (con \u22652 citas), bloque \"Ingresos por canal\" para ver qu\xE9 fuente trae m\xE1s dinero (no solo cantidad), y \"Comparativa mes a mes\" con variaci\xF3n %.','\u2696\uFE0F CAC ahora usa la BASE IMPONIBLE del gasto de marketing (sin IVA si es deducible), consistente con el resto del CRM. Si tu inversi\xF3n era 1210\u20AC IVA inc, el CAC se calcula sobre 1000\u20AC reales.','\uD83D\uDCB0 LTV ahora usa el facturado total (no solo lo cobrado), m\xE1s realista para medir el valor de un cliente.','\uD83D\uDCCB Plantillas de pack: ahora puedes crear TIPOS de pack reutilizables (ej. \"Pack 5 sesiones · 175\u20AC · valido 180 d\xEDas\") y al asignar un pack a un cliente eliges la plantilla y se rellena solo. Antes hab\xEDa que rellenar todo cada vez.','\uD83D\uDCCB Cuando una plantilla est\xE1 en uso, ves cu\xE1ntos clientes la tienen asignada. Borrar una plantilla NO afecta a los packs ya asignados.','\uD83D\uDCCB El campo \"Validez (d\xEDas)\" de la plantilla calcula autom\xE1ticamente la fecha de caducidad al crear cada asignaci\xF3n (ej. 180 d\xEDas = caduca en 6 meses desde la compra).','\uD83D\uDCC4 Clientes en MODO TABLA (CSS Grid alineado): mismas columnas para todos \u2014 Cliente, Contacto, Empresa, Citas, Etiquetas, Equipo. Mucho m\xE1s ordenado que los cards.','\uD83D\uDE97 Nueva plantilla WhatsApp t13 \"De camino\" con variables {temperatura} e {intensidadLuz}. \xDAtil para mandar al cliente cuando vas a su domicilio y necesitas que prepare el ambiente.','\uD83C\uDF21\uFE0F Ficha cliente: 2 campos nuevos \u2014 Temperatura preferida (ej. 22\xB0C) e Intensidad luz preferida (Apagada/Tenue/Media/Alta/Natural). Se usan en las plantillas WhatsApp para personalizar.','\uD83D\uDD04 Inicio vs Finanzas UNIFICADO: las dos pantallas usan la MISMA f\xF3rmula para Ingresos, Gastos y Beneficio neto. Antes Dashboard mostraba cobrado (pagadas) con IVA bruto sin amortizaci\xF3n y Finanzas mostraba facturado base imponible con amortizaci\xF3n \u2014 mareo total. Ahora ambos: Ingresos = facturado del mes, Gastos = base imponible + amortizaci\xF3n, Beneficio = ingresos \u2212 gastos \u2212 comisiones.','\u2705 Encuestas pendientes: ahora cuentan SOLO las citas marcadas como cierre de tratamiento. Antes contaba TODAS las citas completadas a 48h+ aunque no fueras a pedirles encuesta. Si tienes 7 fantasma ahora veras 0 (o las correctas).','\uD83C\uDFAB Auto-consumo de pack: al marcar una cita como completada, si el cliente tiene un pack activo con sesiones libres, autom\xE1ticamente le descuenta 1 sesi\xF3n. No tienes que tachar nada manualmente.','\u2139\uFE0F Nota legal en el modal de gasto: el CRM hace la deducci\xF3n del IVA sin necesidad de foto, pero LEGALMENTE hay que conservar la factura original 4 a\xF1os. La foto en el CRM es opcional, sirve para tenerlo organizado.','\uD83D\uDCA1 UI m\xE1s clara sobre la deducci\xF3n autom\xE1tica del IVA: nuevo banner verde en Gastos que muestra el IVA deducible del mes y aclara que se resta autom\xE1ticamente en Finanzas. Subt\xEDtulos de los 3 KPIs IVA reformulados con signos (+/\u2212/=) para que se vea que es una resta autom\xE1tica.','\u270F\uFE0F Checkbox \"IVA deducible\": ahora deja claro que se restar\xE1 autom\xE1ticamente del IVA a liquidar a Hacienda.','\uD83D\uDCF7 Foto de factura por gasto: bot\xF3n \"Hacer foto / Elegir archivo\". En m\xF3vil abre la c\xE1mara trasera, en ordenador el selector. Imagen comprimida (max 1200px, JPEG 0.7) guardada en localStorage. Indicador \uD83D\uDCCE en la lista para gastos con foto.','\uD83D\uDCC4 Bot\xF3n \"PDF facturas mes\" en Gastos: genera un PDF con TODAS las facturas con foto del mes, una por p\xE1gina, con cabecera (fecha, categor\xEDa, importe, IVA) lista para el gestor.','\u26A0\uFE0F Las fotos viven en localStorage (~5-10MB de cuota navegador). Si llenas, exporta a PDF y borra gastos antiguos. No se sincronizan entre dispositivos.','\uD83D\uDD27 BUG ARREGLADO 50\u20AC \u2192 49,99\u20AC en citas: el c\xE1lculo de subtotal e IVA del auto-ticket sufr\xEDa drift de coma flotante (50/1.21*1.21 \u2260 50 exacto). Ahora todo se redondea a 2 decimales antes de guardar.','\uD83E\uDDFE Gastos con IVA deducible: cada gasto tiene ahora % de IVA (0/4/10/21) y checkbox \"IVA deducible (tengo factura)\". El sistema descompone autom\xE1ticamente Base + IVA y lo muestra al introducir el importe.','\u2696\uFE0F P&L corregido: si el IVA es deducible, el coste real en P&L es la BASE imponible (sin IVA), no el total \u2014 porque el IVA se recupera de Hacienda. Si marcas un gasto como NO deducible, cuenta el total.','\uD83D\uDCB6 Tres KPIs IVA en Finanzas: IVA repercutido (cobrado a clientes), IVA soportado (deducible de gastos), IVA a liquidar (la diferencia, lo que pagas a Hacienda o te devuelven).','\uD83D\uDD04 Gastos: los Fijos Mensuales son ahora RECURRENTES de verdad. Entras alquiler 500\u20AC una vez, se aplica autom\xE1ticamente todos los meses siguientes en P&L y punto de equilibrio. Hasta ahora ten\xEDas que re-introducirlo cada mes \u2014 era un bug.','\u23F9\uFE0F Gastos recurrentes: campo opcional Fecha fin para parar la recurrencia (\xFAtil si dejas el alquiler en X mes).','\uD83D\uDD0D Apartado Gastos: filtros Todos / \uD83D\uDD12 Fijos / \uD83D\uDCC9 Variables arriba a la derecha, con contador y suma de cada uno. As\xED ves de un vistazo separadamente.','\uD83D\uDDD1\uFE0F Borrar gasto: ya pod\xEDas eliminarlo abriendo el gasto y pulsando \"Eliminar\". Eso sigue funcionando si te falla un mes con un fijo o variable que no llega.','\u23F0 Avisos: nuevo recordatorio 24h INDIVIDUAL por cita de ma\xF1ana. Aparece una alerta por cada cita programada para ma\xF1ana (confirmada o no, con tel\xE9fono, no completada ni cancelada). Bot\xF3n verde WhatsApp env\xEDa la plantilla t2 (Recordatorio 24h) personalizada con nombre, hora, servicio y terapeuta. Al pulsar Enviar o \u00D7 se descarta para hoy y vuelve a aparecer si llegan citas nuevas para ma\xF1ana.','\uD83D\uDCC5 Gastos: a\xF1adido selector de FRECUENCIA (mensual / anual) adem\xE1s del tipo (fijo/variable). Cada combinaci\xF3n disponible: Fijo Mensual, Fijo Anual, Variable Mensual, Variable Anual.','\u2696\uFE0F P&L con amortizaci\xF3n de gastos anuales: un gasto anual de 600\u20AC ya no aparece como pico en un solo mes, sino como 50\u20AC/mes durante 12 meses desde la fecha de pago. As\xED el c\xE1lculo del punto de equilibrio y el P&L reflejan el coste mensual real.','\u2696\uFE0F Punto de equilibrio: ahora calcula Costes fijos/mes promediando solo meses CON gasto fijo introducido (antes div\xEDa entre los N meses del periodo). Si entras 7\u20AC un mes, ahora muestra 7\u20AC/mes \u2014 no 0,58\u20AC/mes (que era 7\u20AC/12).','\uD83D\uDCB5 Gastos: cada gasto puede marcarse como FIJO o VARIABLE. Al crear/editar un gasto sale un selector. Variable es el predeterminado. Esto separa correctamente costes en el P&L (costes variables vs fijos) y arregla el punto de equilibrio.','\u23F0 Fix tdISO (fecha de hoy) en 2 sitios: usaba UTC y al inicio del mes en zonas horarias positivas devolv\xEDa fecha del mes anterior. Ahora hora local.','\uD83D\uDD0D P&L \u2014 costes fijos: ahora usa el campo tipo expl\xEDcito del gasto. Para gastos antiguos sin tipo, sigue usando las categor\xEDas t\xEDpicas como fallback.','\uD83D\uDD0D Tabla Facturas convertida a CSS Grid (igual que P&L). Alineaci\xF3n garantizada al 100%. Los nombres largos de cliente se truncan con \u2026 en vez de salirse del borde.','\uD83D\uDCB0 BUG GORDO ARREGLADO en Finanzas: todos los importes sal\xEDan a 0\u20AC aunque hubieras facturado y gastado. La causa: la funci\xF3n que calcula la clave del mes usaba toISOString() (UTC), as\xED en Espa\xF1a (UTC+1/+2) el d\xEDa 1 de cada mes local se convert\xEDa al \xFAltimo d\xEDa del mes anterior en UTC, devolviendo la clave del mes equivocado. Las facturas de mayo nunca matcheaban con la columna MAYO 26 porque el sistema buscaba con la clave 2026-04. Ahora usa hora local en 8 sitios (P&L, cash flow, gastos por categor\xEDa, evoluci\xF3n marketing, cierre de mes\u2026).','\uD83D\uDD0D Tabla P&L convertida a CSS Grid (en lugar de <table>). Con CSS Grid los anchos de columna est\xE1n garantizados \u2014 antes algunos navegadores no respetaban table-layout:fixed.','\uD83D\uDD27 Team save: MERGE en lugar de REPLACE. Si editas un perfil y el form no incluye alg\xFAn campo (rol, esAdmin, etc.), se conservan los valores anteriores. Soluciona el bug del perfil principal que perd\xEDa info.','\uD83D\uDCF1 Ficha cliente: junto al tel\xE9fono, bot\xF3n verde WhatsApp que abre el chat con ese cliente directamente.','\uD83D\uDCF1 Avisos 2d/4d: bot\xF3n ahora dice \"\uD83D\uDCF1 Enviar WhatsApp\" con el verde de WhatsApp para que sea evidente que se env\xEDa por ah\xED, no por SMS.','\u2705 Avisos 2d/4d AUTO-DESAPARECEN al pulsar Enviar (antes el c\xF3digo intentaba marcar la cita como \"enviada\" pero la funci\xF3n save no estaba en scope y fallaba silenciosamente). Ahora se descarta autom\xE1ticamente.','\uD83D\uDD0D Tablas P&L: quitada la sticky positioning del header/label que puede conflictear con tableLayout:fixed en algunos navegadores y causar desalineaciones.','\uD83D\uDD0D Fix alineaci\xF3n EN TODAS las tablas del CRM (no solo P&L y Facturas). A\xF1adido tableLayout:fixed a las 9 tablas con width:100% del dashboard, finanzas, paquetes, marketing, encuestas, packs, etc. Esto fuerza que header y datos compartan los MISMOS anchos de columna y no haya desalineaci\xF3n en ninguna.','\uD83D\uDD0D Fix DEFINITIVO alineaci\xF3n tabla P&L y Facturas: ahora usan tableLayout:fixed con colgroup, anchos expl\xEDcitos por columna. Eso garantiza que header y datos est\xE9n SIEMPRE alineados (antes el navegador auto-ajustaba columnas con criterios distintos para header/body en algunos casos).','\uD83C\uDF81 Restaurado: pr\xF3ximos cumples del Dashboard (3 d\xEDas vista). Al pulsar Felicitar (anticipada) tambi\xE9n se descarta el aviso del d\xEDa de hoy; ma\xF1ana volver\xE1 a salir con \"Cumple en X d\xEDas\" actualizado.','\uD83C\uDF82 Cumples: ahora solo aparecen el d\xEDa del cumplea\xF1os (quitada la lista de pr\xF3ximos). Al pulsar Felicitar, el aviso se descarta autom\xE1ticamente para ese d\xEDa. Al a\xF1o siguiente reaparece autom\xE1ticamente.','\u23F0 Avisos 2d y 4d sin tope: aparecen siempre tras 2 y 4 d\xEDas de cada sesi\xF3n completada y se mantienen hasta que pulses Enviar o el bot\xF3n \u00D7. Antes tras 5-7 d\xEDas desaparec\xEDan solos aunque no los hubieras manejado.','\u26A1 OPTIMIZACI\xD3N guardar cliente: el bot\xF3n Guardar cierra el modal AL INSTANTE. Antes esperaba a Firestore (100ms a varios segundos seg\xFAn red) y parec\xEDa colgado. Sincronizaci\xF3n en background; si falla, aviso.','\u2716\uFE0F Avisos descartables: cada aviso del Dashboard tiene una \u00D7 a la derecha para descartarlo sin ejecutar la acci\xF3n. Cumples descartados reaparecen al d\xEDa siguiente; recordatorios 2d/4d, desaparecen para siempre.','\uD83D\uDCC4 DNI en tickets: la ficha del cliente muestra el DNI adem\xE1s del NIF si est\xE1n rellenos.','\uD83D\uDD0D Fix alineaci\xF3n tabla Facturas: cortaba columnas con nombres largos en pantallas estrechas. Ahora permite scroll horizontal.','\u2B50 Encuestas de satisfacci\xF3n ya NO salen tras cada sesi\xF3n. Solo cuando marcas la \u2018\xFAltima sesi\xF3n del tratamiento\u2019. En la ficha de cita aparece un checkbox \"\uD83C\uDFC1 Cierre del tratamiento\" — al marcarlo Y completar la cita, 48h despu\xE9s la cita pasa a la pesta\xF1a Encuestas para pedir valoraci\xF3n.','\u270F\uFE0F El mensaje de la encuesta ahora es editable: nueva plantilla \"\u2B50 Encuesta satisfacci\xF3n\" en la pesta\xF1a Plantillas (puedes editar texto, emojis, lo que quieras).','\uD83D\uDC8A NUEVO recordatorio 2 d\xEDas: 48h despu\xE9s de cada sesi\xF3n completada sale un aviso en el Dashboard con bot\xF3n \"Enviar\" que dispara la plantilla \"\uD83D\uDC8A Recomendaciones 2d\" (hidrataci\xF3n, descanso, estiramientos\u2026). Plantilla editable.','\uD83D\uDC4B NUEVO recordatorio 4 d\xEDas: 4 d\xEDas despu\xE9s sale otro aviso con la plantilla \"\uD83D\uDC4B Seguimiento 4d\" preguntando c\xF3mo se encuentra. Plantilla editable.','\uD83D\uDEE1\uFE0F BLINDAJE FINAL del equipo: backup autom\xE1tico en localStorage cada vez que team cambia. Si Firestore se corrompe (otra pesta\xF1a/dispositivo con c\xF3digo viejo, etc.) y devuelve un equipo m\xE1s peque\xF1o, el blindaje DETECTA los perfiles perdidos, los fusiona con los nuevos, y RE-ESCRIBE el equipo correcto a Firestore autom\xE1ticamente. Sale aviso en consola con qu\xE9 perfiles ha recuperado.','\uD83D\uDD27 BUG TEAM (FIX TRIPLE DEFINITIVO): 1) Quitada la auto-escritura de [TERAPEUTA_DEFAULT] del initial load — si STORE.get devolv\xEDa null por timing/red (NO porque Firestore estuviera vac\xEDo) machacaba el equipo. 2) El firstTime ya NO usa STORE.get (que mezcla localStorage+Firestore): hace query directo a Firestore para confirmar que est\xE1 REALMENTE vac\xEDo antes de escribir nada. Si Firestore tiene datos, sincroniza con local. 3) Logging defensivo en subscribe — si llega un equipo m\xE1s reducido al esperado, sale aviso en consola (F12) con los detalles.','\uD83D\uDD27 BUG CR\xCDTICO DEL EQUIPO ENCONTRADO Y ARREGLADO: el equipo NO se borraba al editar — se borraba al hacer LOGIN si el sistema de autenticaci\xF3n iba m\xE1s r\xE1pido que la carga de Firestore. Un useEffect cre\xEDa que eras un usuario nuevo (porque a\xFAn no hab\xEDa cargado tu equipo) y machacaba Firestore con [solo admin]. Por eso pasaba tantas veces: cada vez que borrabas cach\xE9, cerrabas pesta\xF1a o cargaba lento, ROOM. Ahora el efecto: 1\xBA espera a que termine la carga inicial, 2\xBA vuelve a leer Firestore para confirmar, 3\xBA solo procede si est\xE1 confirmado que el equipo est\xE1 vac\xEDo de verdad.','\uD83D\uDCAC \"Enviar al cliente\" vuelve a abrir WhatsApp con un saludo, fecha y total pre-rellenados (pero sin el n\xFAmero de ticket — quedaba feo). Sigue descargando el PDF en paralelo para que t\xFA s\xF3lo lo adjuntes al chat.','\uD83D\uDCB6 BUG ARREGLADO: el total de tickets/facturas ya NO suma el IVA por encima del precio cobrado. Los precios introducidos YA incluyen IVA, as\xED que ahora el ticket muestra el desglose correcto: total = lo cobrado, base imponible = total / 1+IVA%, IVA = total - base. Ejemplo: si cobras 30\u20AC al 21%, ahora pone Total 30\u20AC, Base 24,79\u20AC, IVA 5,21\u20AC (antes pon\xEDa 36,30\u20AC).','\uD83D\uDCAC \"Enviar al cliente\" ahora abre WhatsApp en blanco (sin mensaje pre-rellenado) y descarga el PDF — t\xFA ya adjuntas el PDF al chat directamente.','\uD83C\uDFA8 Logo del ticket m\xE1s grande (130px) y mejor centrado en el PDF.','\uD83D\uDD27 BUG ARREGLADO (definitivo): el equipo ya no se borra. Ahora cuando guardas se hace UNI\xD3N entre el equipo en pantalla y el equipo en Firestore (con todas las personas — t\xFA, marketing, terapeutas) — nadie se pierde. Adem\xE1s, si el sistema detecta que un guardado iba a eliminar a alguien, ABORTA y avisa.','\u270D\uFE0F RGPD m\xE1s claro al crear cliente: si te falta firmar consentimiento/RGPD, el formulario hace scroll autom\xE1ticamente a la zona y la resalta — as\xED ves al instante d\xF3nde firmar.','\u23F0 NUEVO: en el modal de Bloquear horario ahora puedes poner hora desde / hora hasta (opcional) para bloquear s\xF3lo un tramo del d\xEDa (reuniones, comidas con clientes, formaciones...). Si los dejas vac\xEDos sigue funcionando como antes (d\xEDa entero). El texto del concepto puede ser libre en el campo Notas.','\uD83C\uDFA8 Tickets y facturas ahora llevan el logo de SANZ centrado arriba en la versi\xF3n imprimible/PDF','\uD83D\uDD27 ARREGLADO: al pulsar \"Enviar al cliente\" el WhatsApp se abre autom\xE1ticamente junto con la ventana de impresi\xF3n (antes se bloqueaba el popup por el aviso de confirmaci\xF3n)','\uD83D\uDCC4 NUEVO: bot\xF3n \"Imprimir / PDF\" en cada factura/ticket — abre la versi\xF3n imprimible (eliges \"Guardar como PDF\" en el cuadro de impresi\xF3n)','\uD83D\uDCAC NUEVO: bot\xF3n \"Enviar al cliente\" en cada factura — imprime el PDF y abre WhatsApp con el mensaje listo, s\xF3lo arrastras el PDF al chat','\uD83D\uDCC5 BUG ARREGLADO: la vista SEMANAL del calendario ahora muestra TODAS las citas de cada hora (antes s\xF3lo se ve\xEDa la primera si hab\xEDa varias). Cada cita aparece como tarjeta apilable, clic en una abre directamente esa cita.','\u23F0 BUG ARREGLADO: Las citas en minutos no en punto (17:45, 19:30, etc.) ahora se ven en el calendario y se pueden abrir y borrar (antes el sistema las detectaba pero no las mostraba en la rejilla)','\uD83D\uDD27 BUG ARREGLADO: Al crear una ficha nueva de cliente ya NO se pierden otros clientes ni la propia ficha — mismo arreglo que se hizo en Equipo (lectura fresca antes de guardar)','\uD83D\uDCAC Mensajes WhatsApp recuperan el formato din\xE1mico — usa las plantillas (Confirmaci\xF3n, Recordatorio 24h, Post-sesi\xF3n, Cumple...) directamente desde la cita','\uD83C\uDF82 Desde la ficha del cliente puedes enviar cualquier plantilla por WhatsApp (cumple, bienvenida, post-sesi\xF3n...) sin necesidad de agendar cita. Si hoy es su cumple, la plantilla se resalta autom\xE1ticamente.','\u23F0 En Avisos: bot\xF3n directo \"Felicitar\" para cumples de hoy y pr\xF3ximos','\uD83D\uDC64 Al abrir una cita guardada ves un panel con la ficha resumen del cliente (alergias, contraindicaciones, etiquetas) + bot\xF3n para abrir la ficha completa, y TODAS las plantillas WhatsApp est\xE1n a un clic','\uD83D\uDCE4 En Plantillas WhatsApp: bot\xF3n \"Enviar a un cliente\" en cada plantilla para mandarla a quien quieras desde ah\xED','\uD83D\uDCB0 Marketing: la opci\xF3n \"% sobre facturaci\xF3n\" pasa a \"% sobre lo que facturan sus clientes la primera vez\"','\u2728 Especialidades de equipo: a\xF1adida \"Marketing\" como opci\xF3n','\uD83D\uDD27 BUG CR\xCDTICO ARREGLADO: al modificar un perfil del equipo ya NO se borran otros perfiles. Causa: el formulario usaba un equipo cacheado; ahora lee siempre el equipo m\xE1s reciente antes de guardar y nunca elimina al admin principal.','\u274C Eliminado el bloque .ics calendario (descarga al ordenador, no llegaba al m\xF3vil del cliente)','\uD83D\uDD27 Cambiado wa.me \u2192 api.whatsapp.com/send: arregla los emojis que se romp\xEDan al enviar desde el ordenador']},{v:'2026.05.15',fecha:'2026-05-15',cambios:['🔒 Los formularios (cliente, cita, factura, gasto, pack, recordatorio, terapeuta, empresa, video, pago) ya NO se cierran al tocar fuera — solo con Guardar o el botón cerrar. Adiós a perder lo escrito por un toque accidental.','💾 Persistencia offline reforzada: doble guardado en cada cambio (Firestore + caché local). Aunque cierres el navegador sin internet o falle la sincronización, los datos quedan a salvo y suben al recuperar conexión.','🔄 Cada cambio sincronizado refresca también la copia local — red de seguridad permanente.']},{v:'2026.05.14',fecha:'2026-05-14',cambios:['🎯 FASE 3 — Encuestas de satisfacción operativas: tras 48h de completar una cita aparece en la pestaña Encuestas con botón WhatsApp pre-rellenado','🎯 FASE 4 — Dashboard financiero completo: P&L mensual, cash flow real, punto de equilibrio, rentabilidad por cliente y servicio, CAC/LTV, proyección 3 meses','🎯 FASE 5 — RGPD obligatorio: imposible crear un cliente nuevo sin firma de consentimiento informado y RGPD','Cuando completas una cita el sistema marca automáticamente la encuesta como pendiente','NPS y valoración media añadidos al Inicio (admin)','Mi panel del terapeuta ahora muestra su valoración media y nº de encuestas']},{v:'2026.05.13',fecha:'2026-05-13',cambios:['Auditoría de cambios — ahora se registra quién hace qué (ver Ajustes)','Backup automático diario — se hace solo al primer login del día','Modo "Solo lectura" para vacaciones (activable desde Ajustes)','Changelog: ya puedes ver las novedades de cada versión','Papelera con retención de 30 días antes del borrado real']},{v:'2026.05.12',fecha:'2026-05-12',cambios:['Sincronización con calendario del cliente (archivos .ics)','IVA incluido en el precio (introduces el total con IVA)','Auto-generar ticket al marcar cita como completada','Configuración fiscal en Ajustes (IVA por defecto, régimen)']},{v:'2026.05.11',fecha:'2026-05-11',cambios:['Rol Marketing — panel especial con métricas de captación','Campo "Captado por" en clientes para comisiones','Sistema de roles completo: admin, terapeuta, marketing','Modo offline robusto con indicador de sincronización','Sincronización en tiempo real entre dispositivos','Buscador inteligente de clientes (incluye DNI/email)','Ordenación de clientes (nombre, apellido, fecha registro, última visita)','Múltiples citas a la misma hora visibles','Bloqueo cita duplicada del mismo cliente a la misma hora','Modal cliente no se cierra al hacer drag fuera']}];const SETTINGS_DEFAULT={/* Datos fiscales */razonSocial:'',nif:'',direccion:'',cp:'',ciudad:'',provincia:'',telefono:'',email:'',iban:'',/* Numeración */serieFactura:'',ultimoNumeroFactura:0,serieTicket:'TKT',ultimoNumeroTicket:0,/* IVA */ivaPorDefecto:21,/* 21% (general), 10% (reducido), 4% (super), 0% (exento) */regimenFiscal:'directa',/* 'directa' (lo normal), 'modulos', 'exento_sanitario' */autoTicketCitas:true,/* Generar ticket automático al marcar cita como completada *//* PIN de bloqueo (4 dígitos, opcional) */pin:'3029',pinHabilitado:true,/* Programa de fidelidad */fidelidadActivo:false,fidelidadCadaXSesiones:10,fidelidadDescuento:100,/* 100% = sesión gratis *//* Backup automático */recordarBackup:true,ultimoBackup:'',ultimoBackupAuto:'',/* Auditoría */auditEnabled:true,/* Modo solo lectura (vacaciones / cierre temporal) */modoSoloLectura:false,modoSoloLecturaMensaje:'',/* Versión del CRM que está corriendo (para mostrar changelog) */ultimaVersionVista:''};const EXP_CATS=[{k:'alquiler',l:'🏢 Alquiler',c:'#8a9ad6'},{k:'material',l:'💧 Material',c:'#4a8edb'},{k:'equipo',l:'🛠️ Equipo',c:'#9b7fd4'},{k:'transporte',l:'🚗 Transporte',c:'#e8c870'},{k:'marketing',l:'📢 Marketing',c:'#3fa978'},{k:'formacion',l:'🎓 Formación',c:'#d14848'},{k:'impuestos',l:'🧾 Impuestos',c:'#6a7f98'},{k:'seguros',l:'🛡️ Seguros',c:'#c9a840'},{k:'otro',l:'📌 Otro',c:'#a0a0a0'}];const INV_CATS=[{k:'aceites',l:'💧 Aceites y cremas',u:'ml/unidad'},{k:'vendajes',l:'🩹 Vendajes',u:'unidad'},{k:'textiles',l:'🧺 Textiles',u:'unidad'},{k:'equipo',l:'🛠️ Equipamiento',u:'unidad'},{k:'limpieza',l:'🧼 Limpieza',u:'unidad'},{k:'otro',l:'📦 Otro',u:'unidad'}];/* ═══════════════════════════════════════════════════════════════════
   TEXTOS LEGALES — editables desde Ajustes si hace falta
   ═══════════════════════════════════════════════════════════════════ *//* Textos legales multilingüe */const TXT_CONSENT_BY_LANG={es:`CONSENTIMIENTO INFORMADO PARA TERAPIAS MANUALES DE RECUPERACIÓN MUSCULAR Y BIENESTAR

Declaro que he sido informado/a de forma clara y comprensible por SANZ Recuperación Muscular sobre la naturaleza, objetivos, beneficios y posibles efectos adversos de las técnicas de recuperación muscular y bienestar corporal que se me van a aplicar (masaje deportivo, relajante, descontracturante, liberación miofascial, estiramientos asistidos, termoterapia, crioterapia, vendaje neuromuscular u otras técnicas manuales no invasivas).

Entiendo y acepto expresamente que:

· Los servicios prestados NO constituyen actos sanitarios ni sustituyen el diagnóstico, tratamiento o seguimiento médico o de fisioterapia. El profesional que me atiende NO ejerce como médico ni fisioterapeuta.
· Estas técnicas tienen finalidad de bienestar, relajación, recuperación muscular y mejora del rendimiento físico.
· Ante cualquier patología, lesión o síntoma debo consultar previamente con un profesional sanitario colegiado.
· Cualquier recomendación recibida durante la sesión es de carácter orientativo y no sustituye consejo médico.

He tenido la oportunidad de preguntar todas mis dudas y estas me han sido resueltas.

Declaro bajo mi responsabilidad que he informado al profesional de:
· Mis patologías previas, lesiones y cirugías conocidas.
· Medicación que tomo actualmente.
· Alergias conocidas (a aceites, cremas, látex, etc.).
· Estado de embarazo, en su caso.
· Cualquier otra condición que pueda afectar a mi seguridad durante la sesión.

Entiendo que durante la sesión pueden aparecer molestias puntuales propias del tratamiento (dolor a la presión, enrojecimiento temporal, sensación de agujetas) y asumo esta posibilidad.

Autorizo expresamente a SANZ Recuperación Muscular a realizar las técnicas acordadas y me comprometo a comunicar cualquier cambio en mi estado de salud antes de cada sesión.

Puedo revocar este consentimiento en cualquier momento sin que ello afecte a servicios ya prestados.`,en:`INFORMED CONSENT FOR MANUAL MUSCLE RECOVERY AND WELLNESS THERAPIES

I declare that I have been clearly and comprehensibly informed by SANZ Recuperación Muscular about the nature, objectives, benefits and possible adverse effects of the muscle recovery and bodily wellness techniques to be applied to me (sports massage, relaxing massage, decontracting massage, myofascial release, assisted stretching, thermotherapy, cryotherapy, neuromuscular taping or other non-invasive manual techniques).

I expressly understand and accept that:

· The services provided are NOT medical acts and do not replace medical or physiotherapy diagnosis, treatment or follow-up. The practitioner attending me does NOT act as a doctor or physiotherapist.
· These techniques aim at wellness, relaxation, muscle recovery and physical performance improvement.
· For any pathology, injury or symptom I must first consult a registered healthcare professional.
· Any recommendation received during the session is orientative and does not replace medical advice.

I have had the opportunity to ask all my questions and they have been answered.

I declare under my own responsibility that I have informed the practitioner of:
· My previous known pathologies, injuries and surgeries.
· Medication I currently take.
· Known allergies (to oils, creams, latex, etc.).
· Pregnancy status, if applicable.
· Any other condition that may affect my safety during the session.

I understand that during the session some discomfort proper to the treatment may appear (pressure-related pain, temporary redness, post-exertion soreness) and I accept this possibility.

I expressly authorize SANZ Recuperación Muscular to perform the agreed techniques and I commit to communicate any change in my health status before each session.

I may revoke this consent at any time, without affecting services already provided.`,fr:`CONSENTEMENT ÉCLAIRÉ POUR THÉRAPIES MANUELLES DE RÉCUPÉRATION MUSCULAIRE ET BIEN-ÊTRE

Je déclare avoir été informé(e) de manière claire et compréhensible par SANZ Recuperación Muscular sur la nature, les objectifs, les bénéfices et les éventuels effets indésirables des techniques de récupération musculaire et de bien-être corporel qui me seront appliquées (massage sportif, relaxant, décontracturant, libération myofasciale, étirements assistés, thermothérapie, cryothérapie, taping neuromusculaire ou autres techniques manuelles non invasives).

Je comprends et accepte expressément que :

· Les services fournis NE constituent PAS des actes de santé et ne remplacent pas le diagnostic, le traitement ou le suivi médical ou de kinésithérapie. Le professionnel qui me reçoit n'exerce PAS comme médecin ou kinésithérapeute.
· Ces techniques visent le bien-être, la relaxation, la récupération musculaire et l'amélioration des performances physiques.
· Face à toute pathologie, blessure ou symptôme, je dois consulter au préalable un professionnel de santé inscrit à l'ordre.
· Toute recommandation reçue pendant la séance est de nature orientative et ne remplace pas un avis médical.

J'ai eu l'occasion de poser toutes mes questions et celles-ci ont reçu une réponse.

Je déclare sous ma responsabilité avoir informé le professionnel de :
· Mes pathologies, blessures et chirurgies antérieures connues.
· Les médicaments que je prends actuellement.
· Mes allergies connues (huiles, crèmes, latex, etc.).
· Mon état de grossesse, le cas échéant.
· Toute autre condition pouvant affecter ma sécurité pendant la séance.

Je comprends que pendant la séance peuvent apparaître des gênes ponctuelles propres au traitement (douleur à la pression, rougeur temporaire, courbatures) et j'accepte cette éventualité.

J'autorise expressément SANZ Recuperación Muscular à réaliser les techniques convenues et m'engage à communiquer tout changement de mon état de santé avant chaque séance.

Je peux révoquer ce consentement à tout moment, sans que cela affecte les services déjà fournis.`,de:`EINVERSTÄNDNISERKLÄRUNG FÜR MANUELLE THERAPIEN ZUR MUSKELERHOLUNG UND ZUM WOHLBEFINDEN

Ich erkläre, dass ich von SANZ Recuperación Muscular klar und verständlich über die Art, Ziele, Vorteile und möglichen Nebenwirkungen der Techniken zur Muskelerholung und zum körperlichen Wohlbefinden informiert wurde, die bei mir angewendet werden sollen (Sportmassage, Entspannungsmassage, Verspannungslösung, myofasziale Lösung, unterstütztes Stretching, Thermotherapie, Kryotherapie, neuromuskuläres Taping oder andere nicht-invasive manuelle Techniken).

Ich verstehe und akzeptiere ausdrücklich, dass:

· Die erbrachten Dienstleistungen KEINE medizinischen Handlungen sind und weder die ärztliche oder physiotherapeutische Diagnose, Behandlung noch Nachsorge ersetzen. Die behandelnde Person handelt NICHT als Arzt oder Physiotherapeut.
· Diese Techniken dienen dem Wohlbefinden, der Entspannung, der Muskelerholung und der Leistungssteigerung.
· Bei jeglicher Erkrankung, Verletzung oder jeglichem Symptom muss ich zuerst eine zugelassene medizinische Fachkraft konsultieren.
· Empfehlungen während der Sitzung sind orientierend und ersetzen keine ärztliche Beratung.

Ich hatte die Möglichkeit, alle meine Fragen zu stellen, und diese wurden beantwortet.

Ich erkläre auf eigene Verantwortung, dass ich die behandelnde Person informiert habe über:
· Meine bekannten Vorerkrankungen, Verletzungen und Operationen.
· Medikamente, die ich derzeit einnehme.
· Bekannte Allergien (Öle, Cremes, Latex usw.).
· Schwangerschaftsstatus gegebenenfalls.
· Jede andere Bedingung, die meine Sicherheit während der Sitzung beeinträchtigen könnte.

Ich verstehe, dass während der Sitzung behandlungstypische Beschwerden auftreten können (Druckschmerz, vorübergehende Rötung, Muskelkater), und akzeptiere diese Möglichkeit.

Ich ermächtige SANZ Recuperación Muscular ausdrücklich, die vereinbarten Techniken durchzuführen, und verpflichte mich, jede Änderung meines Gesundheitszustands vor jeder Sitzung mitzuteilen.

Ich kann diese Einwilligung jederzeit widerrufen, ohne dass dies die bereits erbrachten Leistungen berührt.`};const TXT_RGPD_BY_LANG={es:`TRATAMIENTO DE DATOS PERSONALES (RGPD · LOPDGDD)

Responsable: SANZ Recuperación Muscular.
Finalidad: Gestión de la relación profesional, agenda de citas, historial de sesiones realizadas, facturación y comunicación (SMS/WhatsApp/email) para confirmaciones, recordatorios y seguimiento post-sesión.
Base legal: Consentimiento del interesado (art. 6.1.a RGPD) y ejecución de un contrato de prestación de servicios (art. 6.1.b RGPD). Para los datos relativos a la salud aportados voluntariamente por el cliente (alergias, patologías previas, medicación), consentimiento explícito (art. 9.2.a RGPD).
Categorías de datos: Identificativos, contacto, datos de salud voluntariamente aportados, historial de sesiones de bienestar y datos económicos de facturación.
Destinatarios: No se cederán datos a terceros, salvo obligación legal (Hacienda, Seguridad Social) o cuando sea imprescindible para la prestación del servicio (ej. gestoría fiscal, en régimen de encargado de tratamiento).
Conservación: Los datos se conservarán durante la vigencia de la relación comercial y, tras su finalización, durante los plazos legales obligatorios (datos fiscales: 6 años según Código de Comercio; datos relativos a posibles reclamaciones: 5 años).
Derechos: Acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad, que podré ejercer dirigiéndome a SANZ Recuperación Muscular. Tengo derecho a reclamar ante la AEPD (www.aepd.es) si considero que el tratamiento no se ajusta a la normativa.

Doy mi consentimiento expreso al tratamiento de mis datos personales —incluidos los de salud aportados voluntariamente— en los términos descritos.`,en:`PERSONAL DATA PROCESSING (GDPR · LOPDGDD)

Data Controller: SANZ Recuperación Muscular.
Purpose: Management of the professional relationship, appointment scheduling, session history, billing and communication (SMS/WhatsApp/email) for confirmations, reminders and post-session follow-up.
Legal basis: Consent of the data subject (Art. 6.1.a GDPR) and performance of a service contract (Art. 6.1.b GDPR). For voluntarily provided health-related data (allergies, prior pathologies, medication), explicit consent (Art. 9.2.a GDPR).
Data categories: Identification, contact, voluntarily provided health data, wellness session history and billing data.
Recipients: Data will not be transferred to third parties, except by legal obligation (Tax Authority, Social Security) or when essential for service provision (e.g. tax accountancy, under data processor agreement).
Retention: Data will be kept for the duration of the commercial relationship and afterwards for mandatory legal periods (tax data: 6 years per Spanish Commercial Code; data related to possible claims: 5 years).
Rights: Access, rectification, erasure, objection, restriction of processing and portability, which I may exercise by contacting SANZ Recuperación Muscular. I have the right to lodge a complaint with the Spanish Data Protection Agency (www.aepd.es) if I consider the processing does not comply with regulations.

I give my express consent to the processing of my personal data —including health data voluntarily provided— under the described terms.`,fr:`TRAITEMENT DES DONNÉES PERSONNELLES (RGPD · LOPDGDD)

Responsable du traitement : SANZ Recuperación Muscular.
Finalité : Gestion de la relation professionnelle, agenda des rendez-vous, historique des séances, facturation et communication (SMS/WhatsApp/email) pour confirmations, rappels et suivi post-séance.
Base légale : Consentement de la personne concernée (art. 6.1.a RGPD) et exécution d'un contrat de prestation de services (art. 6.1.b RGPD). Pour les données de santé fournies volontairement (allergies, pathologies antérieures, traitements médicamenteux), consentement explicite (art. 9.2.a RGPD).
Catégories de données : Identification, contact, données de santé volontairement fournies, historique des séances de bien-être et données économiques de facturation.
Destinataires : Les données ne seront pas cédées à des tiers, sauf obligation légale (Trésor public, Sécurité sociale) ou si essentiel à la prestation du service (ex. cabinet comptable, en qualité de sous-traitant).
Conservation : Les données seront conservées pendant la durée de la relation commerciale et, à son terme, pendant les délais légaux obligatoires (données fiscales : 6 ans selon le Code de commerce espagnol ; données liées à d'éventuelles réclamations : 5 ans).
Droits : Accès, rectification, effacement, opposition, limitation du traitement et portabilité, que je peux exercer en m'adressant à SANZ Recuperación Muscular. J'ai le droit d'introduire une réclamation auprès de l'AEPD (www.aepd.es) si je considère que le traitement n'est pas conforme à la réglementation.

Je donne mon consentement exprès au traitement de mes données personnelles —y compris les données de santé fournies volontairement— dans les conditions décrites.`,de:`VERARBEITUNG PERSONENBEZOGENER DATEN (DSGVO · LOPDGDD)

Verantwortlicher: SANZ Recuperación Muscular.
Zweck: Verwaltung der beruflichen Beziehung, Terminkalender, Behandlungshistorie, Rechnungsstellung und Kommunikation (SMS/WhatsApp/E-Mail) für Bestätigungen, Erinnerungen und Nachsorge.
Rechtsgrundlage: Einwilligung der betroffenen Person (Art. 6 Abs. 1 lit. a DSGVO) und Erfüllung eines Dienstleistungsvertrags (Art. 6 Abs. 1 lit. b DSGVO). Für freiwillig bereitgestellte Gesundheitsdaten (Allergien, Vorerkrankungen, Medikamente), ausdrückliche Einwilligung (Art. 9 Abs. 2 lit. a DSGVO).
Datenkategorien: Identifikation, Kontakt, freiwillig bereitgestellte Gesundheitsdaten, Wellness-Sitzungshistorie und Rechnungsdaten.
Empfänger: Die Daten werden nicht an Dritte weitergegeben, außer bei gesetzlicher Verpflichtung (Finanzamt, Sozialversicherung) oder wenn es für die Dienstleistungserbringung wesentlich ist (z. B. Steuerberatung, im Rahmen einer Auftragsverarbeitung).
Aufbewahrung: Die Daten werden während der Dauer der Geschäftsbeziehung und danach für die gesetzlich vorgeschriebenen Fristen aufbewahrt (Steuerdaten: 6 Jahre gemäß spanischem Handelsgesetzbuch; Daten im Zusammenhang mit möglichen Forderungen: 5 Jahre).
Rechte: Auskunft, Berichtigung, Löschung, Widerspruch, Einschränkung der Verarbeitung und Datenübertragbarkeit, die ich durch Kontaktaufnahme mit SANZ Recuperación Muscular ausüben kann. Ich habe das Recht, bei der spanischen Datenschutzbehörde (www.aepd.es) Beschwerde einzulegen, wenn ich der Meinung bin, dass die Verarbeitung nicht den Vorschriften entspricht.

Ich gebe meine ausdrückliche Einwilligung zur Verarbeitung meiner personenbezogenen Daten —einschließlich der freiwillig bereitgestellten Gesundheitsdaten— unter den beschriebenen Bedingungen.`};/* Compatibilidad: variables antiguas siguen apuntando al español */const TXT_CONSENT=TXT_CONSENT_BY_LANG.es;const TXT_RGPD=TXT_RGPD_BY_LANG.es;/* ─────────────────────────────────────────────────────────────────

ADENDA — TRATAMIENTO DE FISIOTERAPIA

En la parte de mi atención que corresponda a fisioterapia, declaro estar informado/a de que:

· He sido informado/a de las técnicas concretas que se aplicarán (terapia manual, ejercicio terapéutico, electroterapia, punción seca u otras) y de sus posibles efectos adversos (dolor temporal, hematomas, mareo).
· La intervención fisioterapéutica no sustituye al diagnóstico médico previo cuando este sea necesario.
· Puedo solicitar en cualquier momento el alta voluntaria del tratamiento.`,nutricion:`

ADENDA — TRATAMIENTO DE NUTRICIÓN

· La nutrición humana y dietética ES una profesión sanitaria regulada por la Ley 44/2003.
· El profesional que me atiende en este sector es un/a dietista-nutricionista colegiado/a.
· El plan nutricional es una recomendación profesional individualizada y NO sustituye al tratamiento médico de patologías concurrentes (diabetes, dislipemia, trastornos de la conducta alimentaria, etc.).
· He informado de mis patologías, alergias, intolerancias y medicación, y entiendo que omitir información puede afectar a mi salud.
· Puedo abandonar el plan en cualquier momento.`,psicologia:`

ADENDA — ATENCIÓN PSICOLÓGICA

En la parte de mi atención que corresponda a psicología, declaro estar informado/a de que:

· La psicología clínica y sanitaria ES una profesión sanitaria regulada por la Ley 44/2003 y la normativa específica de la psicología sanitaria.
· El profesional que me atiende en este sector es un/a psicólogo/a colegiado/a.
· La información compartida en sesión está protegida por secreto profesional, salvo las excepciones legales (riesgo grave para mí o para terceros, requerimiento judicial).

ADENDA — ENTRENAMIENTO PERSONAL

En la parte de mi atención que corresponda a entrenamiento personal, declaro estar informado/a de que:

· El entrenamiento personal NO es un acto sanitario. El profesional que me atiende es entrenador/a titulado/a en ciencias de la actividad física o cualificación equivalente.
· El plan de entrenamiento se ajusta a mi condición física declarada y no sustituye la valoración médica previa cuando exista patología, lesión activa o factor de riesgo cardiovascular.
· Asumo la responsabilidad de comunicar cualquier molestia, lesión o limitación durante las sesiones.
· Entiendo que la actividad física conlleva riesgos inherentes (lesiones musculoesqueléticas, sobrecarga) que se minimizan siguiendo las indicaciones del profesional.`},en:{fisioterapia:`

/* ═══════════════════════════════════════════════════════════════════
   FASE 4 — DASHBOARD FINANCIERO P&L (solo admin)
   ═══════════════════════════════════════════════════════════════════ */
const Finanzas=({invoices,expenses,appointments,clientMap,team,settings,clients,packages,companies,payments})=>{
  const [periodo,setPeriodo]=React.useState('12m');
  const [mostrarYoY,setMostrarYoY]=React.useState(true);

  const hoy=new Date();
  const tdISO=()=>hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');

  /* Helper: parsear YYYY-MM-DD a Date */
  const pDate=d=>{if(!d)return null;const x=new Date(d);return isNaN(x)?null:x;};
  const mesKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');/* FIX: usar hora local en vez de UTC. Antes en zonas horarias positivas devolvia el mes anterior y los datos no matcheaban con invoice.fecha */

  /* Rango temporal según periodo */
  const meses=React.useMemo(()=>{
    const n=periodo==='3m'?3:periodo==='6m'?6:periodo==='12m'?12:24;
    const arr=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      arr.push({k:mesKey(d),label:MES[d.getMonth()]+' '+String(d.getFullYear()).slice(2),anyo:d.getFullYear(),mes:d.getMonth()});
    }
    return arr;
  },[periodo]);

  /* Construir P&L mensual */
  const pnl=React.useMemo(()=>{
    return meses.map(m=>{
      /* Ingresos: facturas pagadas en ese mes (cash basis) y facturadas (accrual) */
      const facturadas=(invoices||[]).filter(i=>i.fecha&&i.fecha.startsWith(m.k));
      const cobradas=(invoices||[]).filter(i=>(i.fechaCobro||i.fecha||'').startsWith(m.k)&&i.estado==='pagada');
      const ingresosFacturados=facturadas.reduce((s,i)=>s+(i.total||0),0);
      const ingresosCobrados=cobradas.reduce((s,i)=>s+(i.total||0),0);
      const subFact=facturadas.reduce((s,i)=>s+(i.subtotal||i.total||0),0);
      const ivaCobrado=facturadas.reduce((s,i)=>s+(i.ivaTotal||0),0);

      /* Gastos: contribuci\xF3n MENSUAL con amortizaci\xF3n de anuales (monto/12 por 12 meses).
